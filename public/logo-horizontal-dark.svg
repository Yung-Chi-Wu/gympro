<svg xmlns="http://www.w3.org/2000/svg" width="260" height="80" viewBox="0 0 260 80">
  <defs>
    <clipPath id="navClipDark">
      <circle cx="40" cy="40" r="28"/>
    </clipPath>
  </defs>

  <!-- Icon circle -->
  <circle cx="40" cy="40" r="33" fill="none" stroke="#F5F3EC" stroke-width="3"/>
  <circle cx="40" cy="40" r="33" fill="none" stroke="#C8955A" stroke-width="3"
    stroke-dasharray="30 178" stroke-dashoffset="-8" stroke-linecap="round"/>
  <circle cx="40" cy="40" r="28" fill="#26241F"/>

  <!-- Dumbbell -->
  <g clip-path="url(#navClipDark)">
    <rect x="16" y="34" width="8" height="12" rx="2" fill="#F5F3EC"/>
    <rect x="22" y="36" width="5" height="8" rx="1" fill="#F5F3EC"/>
    <rect x="27" y="37" width="26" height="6" rx="2" fill="#F5F3EC"/>
    <rect x="53" y="36" width="5" height="8" rx="1" fill="#F5F3EC"/>
    <rect x="56" y="34" width="8" height="12" rx="2" fill="#F5F3EC"/>
    <rect x="35" y="37" width="2" height="6" rx="1" fill="#22201B" opacity="0.25"/>
    <rect x="39" y="37" width="2" height="6" rx="1" fill="#22201B" opacity="0.25"/>
    <rect x="43" y="37" width="2" height="6" rx="1" fill="#22201B" opacity="0.25"/>
  </g>

  <!-- GYM bold -->
  <text x="86" y="50"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="34" font-weight="800" letter-spacing="1" fill="#F5F3EC">GYM</text>

  <!-- PRO gold -->
  <text x="178" y="50"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="34" font-weight="300" letter-spacing="1" fill="#C8955A">PRO</text>
</svg>
