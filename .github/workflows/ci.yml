name: CI

# The free checks, on every pull request and on main: types, lint, the build, the research
# citations, and the offline evals (Ronnie's tools, turn loop and grader, the report's rules and
# grader). No model calls and no secrets. The paid evals (Ronnie's conversations, the
# report's narrative) stay manual: they cost money and are run before a change to a prompt.

on:
  pull_request:
  push:
    branches: [main]

# A new push to a branch cancels its run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commit SHAs, kept current by Dependabot (.github/dependabot.yml)

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lambda/ai-worker/package-lock.json
      - run: npm ci
      # The eval and script bundles are built with the Lambda's esbuild
      - run: npm ci
        working-directory: lambda/ai-worker

      - name: Types
        run: npx tsc --noEmit
      - name: Types (evals and scripts)
        run: npm run typecheck:evals
      - name: Lint
        run: npm run lint
      - name: Research citations resolve
        run: npm run check:evidence
      - name: Ronnie's knowledge notes are complete, their DOIs resolve, and keyword search finds them
        run: |
          npm run check:knowledge
          npm run eval:knowledge -- keyword --min-hit5 0.9
      - name: Day boundaries in every time zone
        run: npm run check:time-zone
      - name: What a user types has the same limits in the app and the tables
        run: npm run check:limits
      - name: The exercise picker lists every group by recent use and equipment
        run: npm run check:exercise-picker
      - name: The install guide reads every browser right
        run: npm run check:browser-env
      - name: Coach G accepts only what it can use and save
        run: npm run check:coach-g
      - name: Every server error reaches app_errors
        run: npm run check:app-errors
      - name: Ronnie's tools, turn loop, recorded conversations and grader (offline)
        run: |
          npm run eval:ronnie:build
          node evals/ronnie/check-executor.mjs
          node evals/ronnie/check-agent.mjs
          node evals/ronnie/check-replays.mjs
          node evals/ronnie/check-grader.mjs
      # No environment variables: every page reads the session per request, so the build
      # never connects to Supabase, Anthropic or AWS
      - name: Build
        run: npm run build

  report-worker:
    name: Report worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lambda/ai-worker/package-lock.json
      # The worker imports the app's lib/ (periods, traces, the report's volume table)
      - run: npm ci
      - run: npm ci
        working-directory: lambda/ai-worker

      - name: Types
        run: npx tsc --noEmit
        working-directory: lambda/ai-worker
      - name: Report rules (offline)
        run: node lambda/ai-worker/evals/report-v3/check-rules.mjs
      - name: Report grader (offline)
        run: node lambda/ai-worker/evals/report-v3/check-grader.mjs
      - name: Report requests run once and stop in time (offline)
        run: node lambda/ai-worker/evals/worker/check-worker.mjs
      - name: The daily Ronnie review reads each ended day once and emails no quotes (offline)
        run: node lambda/ai-worker/evals/worker/check-audit.mjs
      - name: The report reads the goal once per text and measures how far it is (offline)
        run: node lambda/ai-worker/evals/worker/check-goal.mjs
      - name: The report keeps only what the user said, and reads only their own lines to Ronnie (offline)
        run: node lambda/ai-worker/evals/worker/check-context.mjs
      - name: The report's next session and lighter week keep the user's weight, step the right amount and read as written (offline)
        run: node lambda/ai-worker/evals/worker/check-plan.mjs
      - name: Bundle
        run: npm run build
        working-directory: lambda/ai-worker
